name: Refresh Flight Prices Every 2 Days

on:
  schedule:
    # Exécution automatique tous les 2 jours à 06:00 UTC (14:00 heure de Chine / 08:00 heure de Paris)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Permet aussi de lancer un refresh manuel en 1 clic depuis l'onglet Actions de GitHub

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 48h flight price check & rebuild GitHub Pages
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -c "import asyncio; from app.scheduler_task import execute_daily_run; asyncio.run(execute_daily_run())"
          python build_gh_pages.py

      - name: Commit and push updated prices to GitHub Pages
        run: |
          git config user.name "VolAlerte Bot"
          git config user.email "bot@volalerte.local"
          git add docs/ data/
          git diff --staged --quiet || (git commit -m "chore(prices): auto-refresh flight prices (48h cycle)" && git push origin main)
